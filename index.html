<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a14">
    <meta name="description" content="Medivis AR Mobile Viewer — Explore 3D brain anatomy in augmented reality on your phone.">
    <title>Medivis AR Mobile Viewer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Camera feed (hidden until AR mode) -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js canvas -->
    <canvas id="ar-canvas"></canvas>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="brand-mark">
                <svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="10" fill="url(#lg1)"/>
                    <path d="M12 28V14l8 7 8-7v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs><linearGradient id="lg1" x1="0" y1="0" x2="40" y2="40">
                        <stop stop-color="#6E5FF6"/><stop offset="1" stop-color="#3B82F6"/>
                    </linearGradient></defs>
                </svg>
            </div>
            <h2>Medivis AR</h2>
            <div class="spinner"></div>
            <p id="loading-status">Loading 3D model...</p>
        </div>
    </div>

    <!-- Top bar -->
    <header id="top-bar" class="hidden">
        <div class="top-bar-brand">
            <svg class="top-bar-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="40" height="40" rx="10" fill="url(#lg2)"/>
                <path d="M12 28V14l8 7 8-7v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <defs><linearGradient id="lg2" x1="0" y1="0" x2="40" y2="40">
                    <stop stop-color="#6E5FF6"/><stop offset="1" stop-color="#3B82F6"/>
                </linearGradient></defs>
            </svg>
            <div class="top-bar-text">
                <span class="top-bar-name">Medivis</span>
                <span class="top-bar-label">AR Mobile Viewer</span>
            </div>
        </div>
        <button id="info-toggle" aria-label="Toggle info panel">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
                <path d="M10 9v5M10 6.5v.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <!-- Info panel -->
    <div id="info-content" class="hidden">
        <h3>Brain Anatomy</h3>
        <p>Tap a structure to highlight it:</p>
        <ul class="structure-list">
            <li><span class="dot dot-brain"></span> Brain</li>
            <li><span class="dot dot-skull"></span> Skull Cap</li>
            <li><span class="dot dot-face"></span> Face</li>
            <li><span class="dot dot-tumor"></span> Tumor</li>
            <li><span class="dot dot-ventricle"></span> Ventricles</li>
        </ul>
        <a href="https://www.medivis.com" target="_blank" rel="noopener noreferrer" class="info-link">
            Visit medivis.com
        </a>
    </div>

    <!-- Part label -->
    <div id="part-label" class="hidden">
        <span id="part-label-text"></span>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden">
        <span id="toast-text"></span>
    </div>

    <!-- Enter AR button (preview mode) -->
    <button id="enter-ar-btn" class="hidden">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>Enter AR Camera</span>
    </button>

    <!-- Place / Pick Up button (AR mode) -->
    <button id="place-btn" class="hidden">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
        </svg>
        <span id="place-btn-text">Place Model</span>
    </button>

    <!-- Exit AR button (AR mode) -->
    <button id="exit-ar-btn" class="hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
        <span>Exit AR</span>
    </button>

    <!-- Bottom bar -->
    <footer id="bottom-bar" class="hidden">
        <a href="https://www.medivis.com" target="_blank" rel="noopener noreferrer" class="powered-by">
            Powered by <strong>Medivis</strong> &mdash; medivis.com
        </a>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
