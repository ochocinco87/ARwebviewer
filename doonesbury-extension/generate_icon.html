<!DOCTYPE html>
<html><body>
<canvas id="c" width="128" height="128"></canvas>
<script>
const c = document.getElementById("c").getContext("2d");
c.fillStyle = "#1a1a2e";
c.fillRect(0, 0, 128, 128);
c.fillStyle = "#fff";
c.font = "bold 72px Georgia";
c.textAlign = "center";
c.textBaseline = "middle";
c.fillText("D", 64, 60);
c.font = "14px Georgia";
c.fillStyle = "#aaa";
c.fillText("DOONESBURY", 64, 108);
</script>
</body></html>
