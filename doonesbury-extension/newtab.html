<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doonesbury Daily</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
      color: #f5f5f5;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #date-label {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    #comic-container {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 95vw;
      text-align: center;
    }

    #comic-container img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 4px;
    }

    #no-comics {
      color: #ccc;
      font-size: 1.1rem;
      padding: 2rem;
      display: none;
    }

    #nav {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    #nav button {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #334;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Georgia', serif;
      transition: background 0.2s;
    }

    #nav button:hover {
      background: #0f3460;
    }
  </style>
</head>
<body>
  <h1>Doonesbury</h1>
  <div id="date-label"></div>
  <div id="comic-container">
    <img id="comic-img" alt="Doonesbury comic" />
    <div id="no-comics">
      No comics found. Add image files to the <code>comics/</code> folder in the extension directory.
    </div>
  </div>
  <div id="nav">
    <button id="btn-prev">&larr; Previous</button>
    <button id="btn-random">Random</button>
    <button id="btn-next">Next &rarr;</button>
  </div>
  <script src="comics_list.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
