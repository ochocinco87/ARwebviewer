<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Brain Viewer — QR Code</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            padding: 24px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 24px;
        }
        #qr-canvas {
            margin: 0 auto 24px;
            display: block;
            border-radius: 12px;
            background: #fff;
            padding: 16px;
        }
        .url-display {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #6c63ff;
            word-break: break-all;
            margin-bottom: 16px;
        }
        .url-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .url-input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: #fff;
            outline: none;
        }
        .url-input-group input:focus {
            border-color: #6c63ff;
        }
        .url-input-group button {
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .url-input-group button:hover {
            background: #5a52d5;
        }
        .instructions {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.5;
        }
        #download-btn {
            display: inline-block;
            margin-top: 16px;
            background: transparent;
            color: #6c63ff;
            border: 1px solid #6c63ff;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        #download-btn:hover {
            background: rgba(108, 99, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AR Brain Viewer</h1>
        <p class="subtitle">Scan the QR code with a phone camera to launch the AR experience</p>

        <div class="url-input-group">
            <input type="url" id="url-input" placeholder="https://your-deployed-url.com" value="">
            <button id="generate-btn">Generate</button>
        </div>

        <canvas id="qr-canvas" width="256" height="256"></canvas>

        <div class="url-display" id="url-display">Enter your deployment URL above</div>

        <p class="instructions">
            Point your phone's camera at the QR code. On iOS, the Camera app will show a
            notification to open the link. On Android, Google Lens or the camera app will
            detect it automatically.
        </p>

        <button id="download-btn">Download QR Code</button>
    </div>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script>
        const canvas = document.getElementById('qr-canvas');
        const urlInput = document.getElementById('url-input');
        const generateBtn = document.getElementById('generate-btn');
        const urlDisplay = document.getElementById('url-display');
        const downloadBtn = document.getElementById('download-btn');

        // Default to current origin
        const defaultUrl = window.location.origin + window.location.pathname.replace('qr.html', '');
        urlInput.value = defaultUrl;

        function generateQR(url) {
            if (!url) return;
            QRCode.toCanvas(canvas, url, {
                width: 256,
                margin: 2,
                color: {
                    dark: '#0a0a0f',
                    light: '#ffffff'
                },
                errorCorrectionLevel: 'M'
            }, function (error) {
                if (error) {
                    console.error('QR generation error:', error);
                    urlDisplay.textContent = 'Error generating QR code';
                } else {
                    urlDisplay.textContent = url;
                }
            });
        }

        generateBtn.addEventListener('click', () => {
            generateQR(urlInput.value.trim());
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateQR(urlInput.value.trim());
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'ar-brain-viewer-qr.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Generate on load
        generateQR(defaultUrl);
    </script>
</body>
</html>
